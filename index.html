<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuggageGuard - Anti-Theft Tracker</title>
  <!-- Library MQTT via WebSocket -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --danger: #dc2626;
      --safe: #16a34a;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
    }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }
    h1 {
      font-size: 1.4rem;
      margin: 0 0 8px 0;
      text-align: center;
    }
    .role-switch {
      display: flex;
      gap: 8px;
      margin: 16px 0;
    }
    .role-btn {
      flex: 1;
      padding: 10px;
      border: 2px solid var(--primary);
      border-radius: 8px;
      background: white;
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
    }
    .role-btn.active {
      background: var(--primary);
      color: white;
    }
    .btn-action {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-stop {
      background: var(--danger);
      margin-top: 10px;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .badge.connected { background: #dcfce7; color: var(--safe); }
    .badge.disconnected { background: #fee2e2; color: var(--danger); }
    .badge.armed { background: #fee2e2; color: var(--danger); }
    .badge.disarmed { background: #e2e8f0; color: #475569; }
    .status-box {
      text-align: center;
      padding: 24px;
      border-radius: 12px;
      background: #f1f5f9;
      margin: 14px 0;
    }
    .status-box.alert {
      background: #fee2e2;
      border: 2px solid var(--danger);
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.02); }
    }
    .status-title {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .val-display {
      font-size: 2rem;
      font-weight: bold;
      color: var(--primary);
      text-align: center;
      margin: 10px 0;
    }
    .log-box {
      background: #0f172a;
      color: #94a3b8;
      border-radius: 8px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.75rem;
      height: 120px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>LuggageGuard 🧳🚨</h1>
      <p style="text-align: center; margin: 4px 0;">
        Koneksi MQTT: <span id="connStatus" class="badge disconnected">Offline</span>
      </p>

      <div class="role-switch">
        <button id="btnRoleSensor" class="role-btn active" onclick="setRole('sensor')">📱 HP 1 (Tas)</button>
        <button id="btnRoleMonitor" class="role-btn" onclick="setRole('monitor')">🔔 HP 2 (Pemilik)</button>
      </div>

      <button id="btnStart" class="btn-action" onclick="initApp()">Aktifkan Sistem</button>
    </div>

    <!-- Panel HP 1: Sensor Tas -->
    <div id="panelSensor" class="card">
      <h3>Status Proteksi Tas</h3>
      <p>Status Sensor: <span id="sensorState" class="badge disarmed">Standby</span></p>
      <div class="val-display" id="accVal">0.00 m/s²</div>
      <p style="text-align:center; font-size:0.85rem; color:#64748b;">
        Sensitivitas Ambang: Gerakan deviasi > 1.80 m/s² akan memicu alarm.
      </p>
    </div>

    <!-- Panel HP 2: Monitor Pemilik -->
    <div id="panelMonitor" class="card" style="display:none;">
      <h3>Status Pemantauan Pemilik</h3>
      <div id="alarmCard" class="status-box">
        <div id="alarmTitle" class="status-title" style="color: var(--safe);">AMAN</div>
        <div id="alarmSubtitle" style="color: #64748b;">Tidak ada pergerakan mencurigakan.</div>
      </div>
      <button id="btnResetAlarm" class="btn-action btn-stop" style="display:none;" onclick="resetAlarm()">Matikan Peringatan</button>
    </div>

    <div class="card">
      <h4>Aktivitas Telemetri</h4>
      <div class="log-box" id="logText">Menunggu aktivasi sistem...</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
